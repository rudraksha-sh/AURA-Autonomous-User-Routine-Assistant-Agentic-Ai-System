[program:aura-worker]
directory=%(ENV_AURA_BACKEND_DIR)s
command=%(ENV_AURA_WORKER_PYTHON)s -m app.agents.execution.worker
environment=AURA_WORKER_HEALTH_PORT="8091",AURA_WORKER_STALE_SECONDS="90"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
